name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-safety:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Core tests with disposable fixtures
        shell: bash
        run: |
          test_output=$(mktemp -d "$RUNNER_TEMP/app-sweep-ci.XXXXXX")
          export APP_SWEEP_FIXTURES="$test_output/Fixtures.noindex"
          mkdir -m 700 "$APP_SWEEP_FIXTURES"
          export APP_SWEEP_TEST_MACHINE_APPLICATIONS="$APP_SWEEP_FIXTURES/MachineApplications"
          mkdir -m 700 "$APP_SWEEP_TEST_MACHINE_APPLICATIONS"
          export APP_SWEEP_CLANG="$(xcrun --find clang)"
          export APP_SWEEP_SDK="$(xcrun --show-sdk-path)"
          swift test -j 2
  macos-compile-only:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Compile without launching the product
        run: swift build -c release
