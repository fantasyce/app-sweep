name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-safety:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Core tests with disposable fixtures
        shell: bash
        run: |
          export APP_SWEEP_FIXTURES="$(mktemp -d "$RUNNER_TEMP/app-sweep-fixtures.XXXXXX")"
          swift test -j 2
  macos-compile-only:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Compile without launching the product
        run: swift build -c release
